name: "Release"
on:
  push:
    tags:
      - "*"
permissions:
  contents: write # Permiso de escritura necesario para crear releases

env:
  COMPOSER_FLAGS: "--ansi --no-interaction --no-progress --no-suggest --prefer-dist"

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Actualizado a v4

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          extensions: "intl"
          ini-values: "memory_limit=-1"
          php-version: "8.1"

      - name: "Install dependencies"
        run: "composer install ${{ env.COMPOSER_FLAGS }}"

      - name: Build Zip
        # Corrección: Definimos explícitamente el nombre con .zip y usamos '.' para incluir todo
        # -x excluye la carpeta .git para hacer el archivo más ligero
        run: |
          zip -r "artifact-${{ github.ref_name }}.zip" . -x "*.git*"

      - name: Parse Version from Tag
        id: parse_version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          echo "Raw tag: ${RAW_TAG}"

          # Regex ajustado:
          # Grupo 1: Primera versión (Obligatorio)
          # Grupo 2: Segunda versión tras un guion (Opcional)
          REGEX="^v?([0-9.]+)(?:-([0-9.]+))?(?:-.*)?$"

          if [[ $RAW_TAG =~ $REGEX ]]; then
            DRUPAL_VERSION="${BASH_REMATCH[1]}"
            # Si existe el segundo grupo, lo asignamos, si no, N/A
            CIVICRM_VERSION="${BASH_REMATCH[2]:-N/A}"

            echo "Successfully parsed versions."
            echo "Drupal Version: $DRUPAL_VERSION"
            echo "CiviCRM Version: $CIVICRM_VERSION"
          else
            echo "Failed to parse versions from tag: $RAW_TAG"
            DRUPAL_VERSION="N/A"
            CIVICRM_VERSION="N/A"
          fi

          echo "DRUPAL_VERSION=${DRUPAL_VERSION}" >> $GITHUB_ENV
          echo "CIVICRM_VERSION=${CIVICRM_VERSION}" >> $GITHUB_ENV

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifact-${{ github.ref_name }}.zip
          body: |
            Release for Drupal version: ${{ env.DRUPAL_VERSION }}
            CiviCRM version: ${{ env.CIVICRM_VERSION }}
            Tag: ${{ github.ref_name }}