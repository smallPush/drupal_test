name: "Release"
on:
  push:
    tags:
      - "*"
permissions:
  contents: write

env:
  COMPOSER_FLAGS: "--ansi --no-interaction --no-progress --no-suggest --prefer-dist"
  ZIP_FILENAME: "artifact-${{ github.ref_name }}.zip"

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          extensions: "intl"
          ini-values: "memory_limit=-1"
          php-version: "8.1"

      - name: "Install dependencies"
        run: "composer install ${{ env.COMPOSER_FLAGS }}"

      - name: Build Zip
        run: |
          echo "Creando archivo: ${{ env.ZIP_FILENAME }}"
          zip -r "${{ env.ZIP_FILENAME }}" . -x "*.git*"
      - name: "Debug: List files to verify ZIP exists"
        run: |
          echo "Listando archivos en el directorio actual:"
          ls -la
          echo "Verificando si existe ${{ env.ZIP_FILENAME }}..."
          if [ -f "${{ env.ZIP_FILENAME }}" ]; then
            echo "✅ The file exist"
          else
            echo "❌ The file not exist"
            exit 1
          fi

      - name: Parse Version from Tag
        id: parse_version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          REGEX="^v?([0-9.]+)(?:-([0-9.]+))?(?:-.*)?$"
          if [[ $RAW_TAG =~ $REGEX ]]; then
            DRUPAL_VERSION="${BASH_REMATCH[1]}"
            CIVICRM_VERSION="${BASH_REMATCH[2]:-N/A}"
          else
            DRUPAL_VERSION="N/A"
            CIVICRM_VERSION="N/A"
          fi
          echo "DRUPAL_VERSION=${DRUPAL_VERSION}" >> $GITHUB_ENV
          echo "CIVICRM_VERSION=${CIVICRM_VERSION}" >> $GITHUB_ENV

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_FILENAME }} # Use the same var
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Release for Drupal version: ${{ env.DRUPAL_VERSION }}
            CiviCRM version: ${{ env.CIVICRM_VERSION }}
            Tag: ${{ github.ref_name }}